name: gestor-turnos

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestor-turnos-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Definir SA_PASSWORD en .env}
      MSSQL_PID: Developer
    ports:
      - "${SQL_PORT:-14333}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ${BACKEND_PATH:-../gestor-turnos-backend}/src
      dockerfile: GestorTurnos.API/Dockerfile
    image: gestor-turnos-api
    container_name: gestor-turnos-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__GestorTurnosDb: "Server=sqlserver,1433;Database=GestorTurnosDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Database__CreateIfNotExists: "true"
      Database__MaxRetries: "10"
      Database__RetryDelaySeconds: "5"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${API_PORT:-5032}:8080"
    restart: unless-stopped

  web:
    build:
      context: ${FRONTEND_PATH:-../gestor-turnos-frontend}/src
    image: gestor-turnos-web
    container_name: gestor-turnos-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-4200}:80"
    restart: unless-stopped

volumes:
  sqldata:
